<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout canceled — Track3 Pro</title>

    <meta property="og:title" content="Checkout canceled — Track3 Pro" />
    <meta property="og:description" content="Your checkout was canceled and you have not been charged." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Get Track3 — Desktop Downloads and iOS Sideload Steps" />
    <meta name="twitter:description" content="Desktop installers and community iPhone and iPad sideload steps for Track3." />
    <meta name="twitter:image" content="https://track3.domc.me/images/social-overview.jpg" />
    <link rel="canonical" href="https://track3.domc.me/cancel.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="images/app-icon.png"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #ffffff;
        --surface: rgba(255, 255, 255, 0.92);
        --surface-soft: #f5f3ff;
        --surface-strong: #efecff;
        --border: rgba(23, 20, 34, 0.1);
        --border-strong: rgba(109, 92, 255, 0.2);
        --text: #171422;
        --text-muted: #68627d;
        --text-soft: #5e5875;
        --accent: #6d5cff;
        --accent-hover: #5a49ed;
        --accent-soft: #efecff;
        --green: #3f8f53;
        --shadow: 0 20px 60px rgba(73, 63, 148, 0.1);
        --shadow-lg: 0 28px 90px rgba(73, 63, 148, 0.16);
        --radius: 28px;
        --radius-card: 22px;
      }
      html {
        scroll-behavior: smooth;
        font-size: 16px;
        background: var(--bg);
      }
      body {
        font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(23, 20, 34, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 20, 34, 0.025) 1px, transparent 1px);
        background-size: 32px 32px;
        opacity: 0.45;
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.28),
          transparent 92%
        );
        -webkit-mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.28),
          transparent 92%
        );
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      button {
        font: inherit;
      }
      .container {
        width: min(1180px, calc(100% - 48px));
        margin: 0 auto;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-soft);
      }
      .shell-header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 18px 0 0;
      }
      .shell-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 22px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 12px 40px rgba(45, 36, 95, 0.08);
      }
      .shell-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: "Space Grotesk", "Manrope", sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .shell-brand img {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(109, 92, 255, 0.22);
      }
      .shell-links {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .shell-link,
      .shell-link--primary,
      .download-button,
      .download-button--ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 20px;
        border: 1px solid transparent;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s,
          color 0.2s;
      }
      .shell-link {
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text);
      }
      .shell-link:hover {
        background: var(--surface-soft);
        border-color: var(--border-strong);
      }
      .shell-link--primary,
      .download-button {
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 12px 28px rgba(109, 92, 255, 0.24);
      }
      .shell-link--primary:hover,
      .download-button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 16px 34px rgba(109, 92, 255, 0.3);
      }
      .download-button[aria-disabled="true"] {
        pointer-events: none;
        opacity: 0.6;
      }
      .download-button:disabled,
      .download-button--ghost:disabled,
      .download-option:disabled {
        cursor: wait;
        opacity: 0.72;
      }
      .download-button--ghost {
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text);
      }
      .download-button--ghost:hover {
        border-color: var(--border-strong);
        background: var(--surface-soft);
      }
      :focus-visible {
        outline: 3px solid #4835d2;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
      .page {
        padding: 48px 0 120px;
      }
      .hero {
        padding: 54px 0 34px;
      }
      .hero__layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
      }
      .hero__content,
      .hero__side {
        padding: 34px;
        border: 1px solid var(--border);
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: var(--shadow);
      }
      .hero__content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .hero__content .eyebrow {
        margin-bottom: 18px;
      }
      .hero h1 {
        font-family: "Space Grotesk", "Manrope", sans-serif;
        font-size: clamp(2rem, 4.6vw, 4rem);
        line-height: 0.98;
        letter-spacing: -0.05em;
        margin-bottom: 18px;
        max-width: none;
        text-wrap: balance;
      }
      .hero h1 span {
        color: var(--accent-hover);
      }
      .hero p {
        color: var(--text-muted);
        max-width: 58ch;
        font-size: 1.04rem;
      }
      .hero__meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        width: 100%;
      }
      .hero__signals {
        display: grid;
        gap: 14px;
        width: min(100%, 720px);
      }
      .hero__signals .download-badges,
      .hero__signals .release-notes {
        margin: 0;
      }
      .hero__meta-item {
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface-soft);
      }
      .hero__meta-item strong {
        display: block;
        font-size: 1rem;
        margin-bottom: 4px;
      }
      .hero__meta-item span {
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      .section {
        padding: 28px 0;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
      }
      .panel--accent {
        background: linear-gradient(
          180deg,
          rgba(239, 236, 255, 0.78),
          rgba(255, 255, 255, 0.98)
        );
        border-color: rgba(109, 92, 255, 0.18);
      }
      .panel__body {
        padding: 32px;
      }
      .panel__header {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
      }
      .panel__title {
        font-family: "Space Grotesk", "Manrope", sans-serif;
        font-size: clamp(1.6rem, 3vw, 2.4rem);
        line-height: 1.04;
        letter-spacing: -0.04em;
      }
      .panel__text {
        color: var(--text-muted);
      }
      .panel__text a {
        color: #4835d2;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .ios-steps {
        margin: 0;
        padding-left: 1.5rem;
        color: var(--text-muted);
      }
      .ios-steps li + li {
        margin-top: 8px;
      }
      .ios-steps a {
        color: #4835d2;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .download-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #ffffff;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-soft);
      }
      .pill--accent {
        border-color: rgba(109, 92, 255, 0.22);
        background: var(--accent-soft);
        color: var(--accent-hover);
      }
      .recommendation__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 22px 0 20px;
      }
      .release-meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }
      .release-meta__item {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #ffffff;
      }
      .release-meta__label {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-soft);
        margin-bottom: 6px;
      }
      .release-meta__value {
        display: block;
        font-weight: 700;
      }
      .manual-groups {
        display: grid;
        gap: 16px;
      }
      .manual-group {
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: #ffffff;
      }
      .manual-group__header {
        margin-bottom: 16px;
      }
      .manual-group__title {
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .manual-group__copy {
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      .manual-group__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .download-option {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 46px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text);
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.2s;
      }
      .download-option:hover {
        background: var(--surface-soft);
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }
      .download-option__meta {
        color: var(--text-soft);
        font-size: 0.82rem;
      }
      .release-notes {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.95rem;
      }
      .release-notes ul {
        list-style: disc;
        padding-left: 20px;
        margin-top: 10px;
      }
      .release-notes li + li {
        margin-top: 6px;
      }
      .footer {
        padding-top: 24px;
        color: var(--text-soft);
        font-size: 0.9rem;
      }
      @media (max-width: 980px) {
        .hero__layout,
        .release-meta {
          grid-template-columns: 1fr;
        }
        .hero__meta {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 720px) {
        .container {
          width: min(100% - 32px, 1180px);
        }
        .shell-nav {
          padding: 12px 14px;
          border-radius: 28px;
        }
        .shell-links {
          width: auto;
          margin-left: auto;
        }
        .shell-link--primary { display: none; }
        .shell-link,
        .shell-link--primary {
          flex: 1 1 auto;
          min-width: 0;
        }
        .page {
          padding: 34px 0 90px;
        }
        .hero {
          padding-top: 32px;
        }
        .hero__content,
        .hero__side,
        .panel__body,
        .manual-group {
          padding: 24px;
        }
        .recommendation__actions,
        .manual-group__actions {
          flex-direction: column;
        }
        .download-button,
        .download-button--ghost,
        .download-option {
          width: 100%;
        }
      }
    </style>
  <style>
      .notice{max-width:640px;margin:24px auto 48px;padding:48px 56px;background:#fff;border:1px solid rgba(100,90,160,.18);border-radius:24px;box-shadow:0 12px 40px rgba(60,50,120,.08)}
      .notice h1{margin:0 0 20px;line-height:1.15}
      .notice p,.notice li{margin:0 0 18px;line-height:1.65;font-size:1rem}
      .notice ol{margin:0 0 20px;padding-left:1.4em;line-height:1.7}
      .notice li{margin-bottom:8px}
      .notice .shell-link--primary{display:inline-block;margin-top:8px}
      @media (max-width:520px){.notice{padding:32px 24px;margin:24px 16px}}
    </style>
  </head>
  <body>
    <header class="shell-header">
      <div class="container shell-nav">
        <a href="./index.html" class="shell-brand">
          <img
            src="images/app-icon.png"
            alt="Track3 icon"
            width="36"
            height="36"
          />
          Track3
        </a>
        <div class="shell-links">
          <a href="./index.html" class="shell-link">Back to Home</a>
          <a href="./download.html" class="shell-link--primary">Downloads</a>
        </div>
      </div>
    </header>
    <main class="page">
      <section class="hero">
        <div class="container">
          <div class="notice">
            <h1>Checkout canceled</h1>
            <p>No charge was made. You can return to the Track3 app and start the upgrade again whenever you like.</p>
            <p>Track3 keeps working with the free features in the meantime.</p>
            <p><a class="shell-link--primary" href="./index.html#pro">See what Pro includes</a></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
