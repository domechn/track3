[package]
name = "track3-pure-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Keep shared versions aligned with ../Cargo.toml; this crate compiles the app's Rust source files.
aes = "=0.8.4"
aes-gcm-siv = "0.11.1"
base64 = "0.22.1"
binance-rs-async = {version = "1.3.3", features = ["wallet_api", "futures_api", "savings_api", "margin_api"]}
cbc = "=0.1.2"
coingecko = {git = "https://github.com/domechn/coingecko-rs.git", rev = "41e819e"}
fs2 = "=0.4.3"
indexmap = "=2.11.4"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
sha2 = "=0.10.9"
sqlx = {version = "=0.8.5", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"]}
tokio = {version = "=1.44.2", features = ["sync", "rt-multi-thread"]}
uuid = {version = "=1.20.0", features = ["v4"]}
reqwest = "=0.12.15"
version-compare = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.185"

[dev-dependencies]
ring = "0.17"
