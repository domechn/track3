name: "test-on-pr"
on: [pull_request]

jobs:
  quality:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check owner-applied format exception
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels | any(.name == "format-exception-approved")')"
          last_event="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events" --paginate --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "format-exception-approved") | [.event, .actor.login] | @tsv' | tail -n 1)"
          if [[ "$current" == "true" && "$last_event" == $'labeled\tdomechn' ]]; then
            echo "FORMAT_EXCEPTION_APPROVED=true" >> "$GITHUB_ENV"
          fi
      - name: Check UI refactor boundaries
        run: |
          node --test scripts/ui-refactor-guard.test.mjs
          node scripts/ui-refactor-guard.mjs "origin/${{ github.base_ref }}"
      - name: enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install frontend dependencies
        run: corepack yarn install --immutable
      - name: test frontend
        run: corepack yarn test
      - name: check frontend coverage
        run: corepack yarn test:coverage
      - name: build frontend
        run: corepack yarn build
      - name: test Rust
        run: cargo test --locked --all-targets
        working-directory: src-tauri
      - name: test Rust without GTK
        run: cargo test --locked -p track3-pure-tests --lib
        working-directory: src-tauri
      - name: check Rust
        run: cargo check --locked
        working-directory: src-tauri

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - name: install frontend dependencies
        run: corepack yarn install --immutable
      - name: install Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: type-check browser tests
        run: corepack yarn tsc -p tests/e2e/tsconfig.json --noEmit
      - name: smoke test
        run: corepack yarn test:e2e

  test-tauri:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - name: get yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install target (mac only)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
      - name: install frontend dependencies
        run: corepack yarn install --immutable

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: corepack yarn tauri
          args: ${{ matrix.args }}
      - name: verify the macOS app is ad-hoc code signed (mac only)
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find src-tauri/target -type d -name 'track3.app' -path '*release/bundle/macos*' | head -1)
          test -n "$APP"
          echo "app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Signature=adhoc" "$RUNNER_TEMP/codesign.txt"
